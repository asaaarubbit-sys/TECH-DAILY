<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Sekolah - TECH DAILY</title>
    <link rel="stylesheet" href="css/style.css">

    <style>

        .contact-intro {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 30px;
            line-height: 1.7;
            color: var(--paragraph-color);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .contact-card {
            background-color: var(--soft-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 22px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .contact-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            background-color: #28746f;
            color: white;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .contact-info h4 {
            font-family: Georgia, serif;
            color: var(--heading-color);
            margin-bottom: 8px;
            font-size: 18px;
        }

        .contact-info p {
            color: var(--text-color);
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .contact-info a {
            color: var(--heading-color);
            font-weight: bold;
            text-decoration: none;
        }

        .contact-info a:hover {
            color: #28746f;
            text-decoration: underline;
        }

    
        .maps-box {
            background-color: var(--soft-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
        }

        .maps-box p {
            color: var(--paragraph-color);
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .maps-button {
            display: inline-block;
            background-color: #28746f;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 7px;
            font-weight: bold;
            transition: 0.3s;
        }

        .maps-button:hover {
            background-color: #173747;
            transform: translateY(-2px);
        }

    
        .social-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .social-item {
            background-color: var(--soft-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px 12px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            transition: 0.3s;
        }

        .social-item:hover {
            transform: translateY(-4px);
            border-color: #28746f;
        }

        .social-item span {
            display: block;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .social-item h4 {
            color: var(--heading-color);
            font-family: Georgia, serif;
            margin-bottom: 5px;
        }

        .social-item p {
            font-size: 13px;
            overflow-wrap: anywhere;
        }

    
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-weight: bold;
            color: var(--text-color);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            background-color: var(--card-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: 2px solid #28746f;
            border-color: #28746f;
        }

        .send-button {
            background-color: #28746f;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .send-button:hover {
            background-color: #173747;
        }

        .form-note {
            color: var(--paragraph-color);
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }

            .social-list {
                grid-template-columns: 1fr;
            }

            .contact-card {
                padding: 18px;
            }
        }
    </style>
</head>
